<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model viewer dev page</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #8a8d91; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; left: 12px; top: 12px; z-index: 10; font: 12px/1.5 ui-monospace, monospace; color: #111; background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 8px; white-space: pre; }
      .hud[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="hud" id="hud" hidden></div>
    <script type="module" src="/dev/model-viewer.ts"></script>
  </body>
</html>
