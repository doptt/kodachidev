    <title>Alien actor dev page</title>

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #000; color: #ffedc1; font-family: system-ui, sans-serif; overflow: hidden; }

      .hud button { font: inherit; color: inherit; background: rgba(255,237,193,.08); border: 1px solid rgba(188,166,142,.4); border-radius: 6px; padding: 2px 8px; margin: 0 4px 4px 0; cursor: pointer; }
      .hud button:hover { background: rgba(255,237,193,.18); }
    </style>
