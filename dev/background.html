<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background dev page</title>
    <link rel="preload" as="image" href="/bg/still-1280.webp" media="(max-width: 1279px)" />
    <link rel="preload" as="image" href="/bg/still.webp" media="(min-width: 1280px)" />
    <style>
      * { box-sizing: border-box; }
      /* Only body gets the background so it propagates to the viewport canvas and stays behind the z-index:-10 layer. */
      body { background: #05061a; }
      html, body { margin: 0; color: #eef0ff; font-family: system-ui, sans-serif; }
      section { position: relative; min-height: 100vh; display: grid; place-items: center; }
      .label { font-size: clamp(40px, 8vw, 120px); font-weight: 200; letter-spacing: -0.03em; opacity: 0.9; text-align: center; }
      .label small { display: block; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; margin-top: 16px; }
      .hud { position: fixed; top: 12px; left: 12px; font: 12px/1.5 ui-monospace, monospace; background: rgba(5,6,26,.55); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(142,150,255,.25); z-index: 10; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/background.tsx"></script>
  </body>
</html>
