<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moon dev page</title>
    <style>
      * { box-sizing: border-box; }
      html, body.moon-dev { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #root { position: fixed; inset: 0; }
      .hud { position: fixed; left: 12px; top: 12px; z-index: 20; font: 12px/1.6 ui-monospace, monospace; color: #ffedc1; background: rgba(7,5,2,.72); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(188,166,142,.3); }
      .hud input { width: 320px; vertical-align: middle; accent-color: #ffedc1; }
    </style>
  </head>
  <body class="moon-dev">
    <canvas id="stage" aria-hidden="true"></canvas>
    <main id="root"></main>
    <script type="module" src="/dev/moon.tsx"></script>
  </body>
</html>
