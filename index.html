    <!--
      The preloader. Inline, so it paints before any script or stylesheet has
      arrived. src/motion/intro.ts fills in its progress (the custom property
      p, 0 to 1: the mark draws itself and the line fills with it) and adds
      is-leaving to wipe it away. If scripts never run, it takes itself away.
    -->
    <style>
      #preloader {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #05061a; color: #b7bcff;
        clip-path: inset(0 0 0 0);
        transition: clip-path 900ms cubic-bezier(0.65, 0, 0.35, 1);
        animation: pl-failsafe 0s linear 12s forwards;
      }
      #preloader.is-leaving { clip-path: inset(0 0 100% 0); pointer-events: none; }
      #preloader .pl-mark { width: 52px; height: 52px; overflow: visible; transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1), opacity 500ms linear; }
      #preloader.is-leaving .pl-mark { transform: translateY(-28px); opacity: 0; }
      #preloader .pl-mark path { stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--p, 0)); }
      #preloader .pl-count {
        position: absolute; left: clamp(1.25rem, 4vw, 3.5rem); bottom: 1.6rem;
        font: 500 0.72rem/1 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        letter-spacing: 0.1em; font-variant-numeric: tabular-nums; color: #8089c4;
      }
      #preloader .pl-line { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgb(183 188 255 / 0.12); }
      #preloader .pl-line i { display: block; height: 100%; background: #b7bcff; transform-origin: left; transform: scaleX(var(--p, 0)); }
      @keyframes pl-failsafe { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #preloader { transition: opacity 300ms linear; }
        #preloader.is-leaving { clip-path: none; opacity: 0; }
        #preloader .pl-mark { transition: none; }
      }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <svg class="pl-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
        <path pathLength="1" d="M12 3 2.5 16.5 13.5 21 21.5 15.5Z" />
        <path pathLength="1" d="M12 3 13.5 21" />
        <path pathLength="1" d="M2.5 16.5 21.5 15.5" stroke-opacity="0.4" />
      </svg>
      <span class="pl-count">000</span>
      <span class="pl-line"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
